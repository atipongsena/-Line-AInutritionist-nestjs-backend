# .github/workflows/deploy-frontend-vercel.yml
name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main # หรือ branch ที่ต้องการ deploy
    paths:
      - 'liff-nutrition-next/**'
      - '.github/workflows/deploy-frontend-vercel.yml'
  pull_request:
    paths:
      - 'liff-nutrition-next/**'
      - '.github/workflows/deploy-frontend-vercel.yml'

jobs:
  deploy_vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9 # หรือเวอร์ชั่นที่คุณใช้

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # หรือเวอร์ชั่นที่คุณใช้
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml' # Cache dependencies สำหรับ monorepo

      - name: Install Dependencies (Monorepo)
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel Project Settings
        # Path to your Next.js app, relative to the monorepo root
        # This command links the local directory to your Vercel project and pulls down environment variables.
        # Make sure your Vercel project is already created and linked to this Git repository.
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./liff-nutrition-next # Ensure this path is correct

      - name: Build Project
        # Vercel build automatically picks up Next.js config.
        # Pass environment variables from Vercel (pulled in previous step) or GitHub secrets
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./liff-nutrition-next
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }} # Example

      - name: Deploy Project to Vercel
        run: vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./liff-nutrition-next

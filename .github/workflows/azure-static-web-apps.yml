name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'liff-profile-app/**'
      - '.github/workflows/azure-static-web-apps.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master
    paths:
      - 'liff-profile-app/**'
      - '.github/workflows/azure-static-web-apps.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          cd liff-profile-app
          pnpm install

      - name: Build application
        run: |
          cd liff-profile-app
          pnpm run build
        env:
          NODE_ENV: production
          VITE_LIFF_ID: 2007349762-AJ9J432d
          VITE_API_BASE_URL: https://ai-nutritionist-backend.wittyground-3784ecfe.southeastasia.azurecontainerapps.io

      - name: Copy build files to deploy folder
        run: |
          mkdir -p deploy
          cp -r liff-profile-app/build/* deploy/
          cp liff-profile-app/staticwebapp.config.json deploy/
          cp liff-profile-app/.env.production deploy/.env.production
          ls -la deploy/

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_POND_09F432200 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/deploy'
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_POND_09F432200 }}
          action: 'close'
          app_location: '/liff-profile-app'

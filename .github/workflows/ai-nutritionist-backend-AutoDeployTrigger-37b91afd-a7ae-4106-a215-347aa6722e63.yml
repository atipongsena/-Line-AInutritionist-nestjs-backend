name: Trigger auto deployment for ai-nutritionist-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/ai-nutritionist-backend-AutoDeployTrigger-37b91afd-a7ae-4106-a215-347aa6722e63.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AINUTRITIONISTBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AINUTRITIONISTBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AINUTRITIONISTBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: kingeng.azurecr.io
          registryUsername: ${{ secrets.AINUTRITIONISTBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AINUTRITIONISTBACKEND_REGISTRY_PASSWORD }}
          containerAppName: ai-nutritionist-backend
          resourceGroup: DefaultResourceGroup-SEA
          imageToBuild: kingeng.azurecr.io/ai-nutritionist-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


